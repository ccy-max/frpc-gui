# GitHub Actions 自动构建 Windows EXE
# 触发条件：push 到 main 分支 或 创建 release tag

name: Build Windows EXE

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch: # 允许手动触发

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Build Tauri App
        run: npm run tauri build
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build artifacts (Debug)
        run: |
          echo "=== Build output ==="
          ls -la src-tauri/target/release/ | Select-String "frpc|FRPC"
          echo "=== Bundle output ==="
          ls -la src-tauri/target/release/bundle/ -Recurse | Select-String "exe|msi" | Select-Object -First 20
        shell: pwsh
        working-directory: .

      - name: Upload Windows EXE (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: FRPC-GUI-Windows-EXE
          path: |
            src-tauri/target/release/frpc-gui.exe
            src-tauri/target/release/*.dll
          retention-days: 30
          if-no-files-found: error

      - name: Upload Installers (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: FRPC-GUI-Installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30
          if-no-files-found: error

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/FRPC GUI.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          body: |
            ## 🎉 FRPC GUI ${{ github.ref_name }}
            
            ### 📦 下载
            - **FRPC GUI.exe** - 直接运行的可执行文件（推荐）
            - **FRPC GUI_*_x64-setup.exe** - NSIS 安装程序
            - **FRPC GUI_*_x64.msi** - MSI 安装包
            
            ### ✨ 更新内容
            详见 [CHANGELOG.md](CHANGELOG.md)
            
            ### 📝 使用说明
            1. 下载 `FRPC GUI.exe`
            2. 双击运行即可
            3. 无需安装，无需 .NET Framework
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux Packages
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            libssl-dev \
            pkg-config \
            libclang-dev \
            cmake \
            build-essential

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri App
        run: npm run tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux Packages (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: FRPC-GUI-Linux-Packages
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          body: |
            ## 🎉 FRPC GUI ${{ github.ref_name }} - Linux
            
            ### 📦 下载
            - **DEB** - Debian/Ubuntu 系统
            - **RPM** - Fedora/CentOS/RHEL 系统
            - **AppImage** - 通用 Linux 格式
            
            ### ✨ 更新内容
            详见 [CHANGELOG.md](CHANGELOG.md)
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS App
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri App
        run: npm run tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}

      - name: Upload macOS App (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: FRPC-GUI-macOS
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/app/*.app
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/app/*.app
          body: |
            ## 🎉 FRPC GUI ${{ github.ref_name }} - macOS
            
            ### 📦 下载
            - **DMG** - 磁盘镜像（推荐）
            - **APP** - 应用程序包
            
            ### ✨ 更新内容
            详见 [CHANGELOG.md](CHANGELOG.md)
            
            ### ⚠️ 首次运行提示
            如果提示"无法打开"，请：
            1. 右键点击 APP
            2. 选择"打开"
            3. 在弹出的对话框中再次点击"打开"
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
