# GitHub Actions 自动构建 Windows EXE
# 触发条件：创建版本标签 (v*) 或手动触发

name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri App
        run: npm run tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build artifacts (Debug)
        run: |
          echo "=== Build output ==="
          Get-ChildItem src-tauri/target/release/ -Filter "*frpc*" | Select-Object Name, Length
        shell: pwsh

      - name: Upload Windows EXE (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: FRPC-GUI-Windows-EXE
          path: |
            src-tauri/target/release/frpc-gui.exe
            src-tauri/target/release/*.dll
          retention-days: 30
          if-no-files-found: error

      - name: Upload Installers (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: FRPC-GUI-Installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30
          if-no-files-found: error

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/frpc-gui.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          body: |
            ## 🎉 FRPC GUI ${{ github.ref_name }}

            ### 📦 下载
            - **frpc-gui.exe** - 直接运行（推荐）
            - **frpc-gui_*_x64-setup.exe** - NSIS 安装程序
            - **frpc-gui_*_x64.msi** - MSI 安装包
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
