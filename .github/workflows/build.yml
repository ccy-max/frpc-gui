# GitHub Actions 自动构建 Windows EXE
# 触发条件：创建版本标签 (v*) 或手动触发
# tag 推送时自动创建 GitHub Release（非草稿，直接发布）

name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史，用于生成 changelog

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri App
        run: npm run tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build artifacts (Debug)
        run: |
          echo "=== Build output ==="
          Get-ChildItem src-tauri/target/release/ -Filter "*frpc*" | Select-Object Name, Length
        shell: pwsh

      - name: Rename EXE with version tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          Copy-Item src-tauri/target/release/frpc-gui.exe "src-tauri/target/release/frpc-gui-${{ github.ref_name }}.exe"
          Write-Host "Renamed to frpc-gui-${{ github.ref_name }}.exe"
        shell: pwsh

      - name: Upload Windows EXE (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: FRPC-GUI-Windows-EXE-${{ github.ref_name }}
          path: |
            src-tauri/target/release/frpc-gui.exe
            src-tauri/target/release/frpc-gui-v*.exe
            src-tauri/target/release/*.dll
          retention-days: 30
          if-no-files-found: error

      - name: Upload Installers (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: FRPC-GUI-Installers-${{ github.ref_name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30
          if-no-files-found: error

      - name: Generate changelog
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          CURRENT_TAG=${GITHUB_REF#refs/tags/}
          # 获取上一个 tag（按创建时间排序，排除当前 tag）
          PREV_TAG=$(git tag --sort=creatordate | grep -E '^v[0-9]' | grep -v "^${CURRENT_TAG}$" | tail -1)

          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s" HEAD)
          else
            COMMITS=$(git log --pretty=format:"- %s" "${PREV_TAG}..HEAD")
          fi

          # 过滤 merge commit 和纯版本号同步 commit
          COMMITS=$(echo "$COMMITS" | grep -v "^- Merge pull request" | grep -v "^- Merge branch" | grep -v "^- v[0-9].*: 版本号" || true)

          # 生成 release body
          {
            echo "## 🎉 FRPC GUI ${CURRENT_TAG}"
            echo ""
            echo "### 📦 下载"
            echo "- **frpc-gui-${CURRENT_TAG}.exe** - 直接运行（推荐）"
            echo "- **frpc-gui_*_x64-setup.exe** - NSIS 安装程序"
            echo "- **frpc-gui_*_x64.msi** - MSI 安装包"
            echo ""
            echo "### ✨ 本次变更"
            echo "${COMMITS}"
          } > /tmp/release_body.md

          echo "✅ Changelog generated ($(wc -l < /tmp/release_body.md) lines, prev tag: ${PREV_TAG:-none})"
          echo "--- preview ---"
          cat /tmp/release_body.md

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/frpc-gui-${{ github.ref_name }}.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          body_path: /tmp/release_body.md
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
