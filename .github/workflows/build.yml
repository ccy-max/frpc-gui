# GitHub Actions 自动构建 Windows EXE
# 触发条件：创建版本标签 (v*) 或手动触发
# tag 推送时自动创建 GitHub Release（非草稿，直接发布）

name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri App
        run: npm run tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build artifacts (Debug)
        run: |
          echo "=== Build output ==="
          Get-ChildItem src-tauri/target/release/ -Filter "*frpc*" | Select-Object Name, Length
        shell: pwsh

      - name: Rename EXE with version tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          Copy-Item src-tauri/target/release/frpc-gui.exe "src-tauri/target/release/frpc-gui-${{ github.ref_name }}.exe"
          Write-Host "Renamed to frpc-gui-${{ github.ref_name }}.exe"
        shell: pwsh

      - name: Upload Windows EXE (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: FRPC-GUI-Windows-EXE-${{ github.ref_name }}
          path: |
            src-tauri/target/release/frpc-gui.exe
            src-tauri/target/release/frpc-gui-v*.exe
            src-tauri/target/release/*.dll
          retention-days: 30
          if-no-files-found: error

      - name: Upload Installers (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: FRPC-GUI-Installers-${{ github.ref_name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/frpc-gui-${{ github.ref_name }}.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          body: |
            ## 🎉 FRPC GUI ${{ github.ref_name }}

            ### 📦 下载
            - **frpc-gui-${{ github.ref_name }}.exe** - 直接运行（推荐）
            - **frpc-gui_*_x64-setup.exe** - NSIS 安装程序
            - **frpc-gui_*_x64.msi** - MSI 安装包

            ### ✨ 本版本亮点
            - 概览页实时日志改为代理请求信息卡片（Admin API 驱动）
            - 右键刷新防护（禁右键 + 拦截 F5 + frpcStartedAt 持久化）
            - 概览页状态同步修复（字段名匹配 + isRunning 基于 serverStatuses）
            - 启动/停止按钮加载动画
            - 远程仓库过程文档清理
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
